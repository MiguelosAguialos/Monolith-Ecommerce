services:
  db:
    image: postgres:latest
    container_name: db-container
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      POSTGRES_USER: "${SPRING_DATASOURCE_USERNAME}"
      POSTGRES_PASSWORD: "${SPRING_DATASOURCE_PASSWORD}"
      POSTGRES_DB: "${SPRING_DATASOURCE_DB}"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: ./common-config.yml
      service: network-deploy-service
  ecommerce:
    image: "ecommerce/monolith-ecommerce:${VERSION:-latest}"
    container_name: monolith-ecommerce
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    mem_limit: 2g
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: ./common-config.yml
      service: network-deploy-service
networks:
  ecommerce:
    driver: bridge
